<title>The Monte Cristo Glossary</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,600;6..96,700&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ink:#0A1520; --panel:#101E2B; --panel-2:#16283A; 
  --paper:#E9EDF0; --paper-2:#DFE5EA; --paper-line:#C6D0D8;
  --gold:#A8801F; --gold-soft:#8A6A19; --sea:#2E6F8E;
  --fg:#12202C; --fg-muted:#4E6172; --fg-faint:#77899A;
  --bg:var(--paper); --surface:#FFFFFF; --surface-2:var(--paper-2);
  --edge:var(--paper-line); --accent:var(--gold); --accent-ink:#3A2D06;
  --known:#3F7A5A;
  --display:"Bodoni Moda",Didot,"Times New Roman",serif;
  --body:"Spectral",Georgia,"Times New Roman",serif;
  --ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --rail:270px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:var(--ink); --surface:var(--panel); --surface-2:var(--panel-2);
    --edge:#23384B; --fg:#DFE8EF; --fg-muted:#9DB0C0; --fg-faint:#6E8496;
    --accent:#D4AF37; --accent-ink:#1A1305; --sea:#6FA8C4; --known:#6FBF92;
  }
}
:root[data-theme="dark"]{
  --bg:var(--ink); --surface:var(--panel); --surface-2:var(--panel-2);
  --edge:#23384B; --fg:#DFE8EF; --fg-muted:#9DB0C0; --fg-faint:#6E8496;
  --accent:#D4AF37; --accent-ink:#1A1305; --sea:#6FA8C4; --known:#6FBF92;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:0 56px}

/* ---------- masthead ---------- */
.mast{padding-block:38px 22px;border-bottom:1px solid var(--edge)}
.eyebrow{font-family:var(--ui);font-size:11px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--fg-faint);margin:0 0 10px}
h1{font-family:var(--display);font-weight:700;font-size:clamp(30px,5.2vw,50px);
  line-height:1.04;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1 em{font-style:italic;color:var(--accent)}
.standfirst{font-size:15.5px;color:var(--fg-muted);max-width:62ch;margin:14px 0 0}
.standfirst a{color:var(--sea)}

/* ---------- progress ---------- */
.meter{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:20px}
.meter-bar{flex:0 1 320px;height:5px;background:var(--surface-2);position:relative;
  min-width:150px;overflow:hidden;border:1px solid var(--edge);border-radius:100px}
.meter-fill{position:absolute;inset:0 auto 0 0;background:var(--accent);width:0;
  transition:width .35s ease}
.meter-txt{font-family:var(--ui);font-size:12.5px;color:var(--fg-muted);
  font-variant-numeric:tabular-nums}
.meter-txt b{color:var(--fg);font-weight:600}

/* ---------- controls ---------- */
.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;
  padding-block:18px;border-bottom:1px solid var(--edge)}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;font-family:var(--ui);font-size:14px;color:var(--fg);
  background:var(--surface);border:1px solid var(--edge);border-radius:2px;
  padding:9px 12px 9px 32px}
.search input::placeholder{color:var(--fg-faint)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;stroke:var(--fg-faint);fill:none;stroke-width:1.8}
.tog{font-family:var(--ui);font-size:12.5px;color:var(--fg-muted);
  display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none}
.tog input{accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
.guard{font-family:var(--ui);font-size:12.5px;color:var(--fg-muted);
  display:inline-flex;align-items:center;gap:7px}
.guard input[type=number]{width:56px;font-family:var(--ui);font-size:12.5px;
  background:var(--surface);color:var(--fg);border:1px solid var(--edge);
  border-radius:2px;padding:4px 6px;font-variant-numeric:tabular-nums}
.guard input[type=number]:disabled{opacity:.4}

.chips{display:flex;gap:6px;flex-wrap:wrap;padding-block:14px}
.chip{font-family:var(--ui);font-size:11px;letter-spacing:.07em;
  text-transform:uppercase;padding:4px 9px;border:1px solid var(--edge);
  border-radius:100px;background:transparent;color:var(--fg-muted);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--accent-ink);font-weight:600}

/* ---------- layout ---------- */
.cols{display:grid;grid-template-columns:var(--rail) 1fr;gap:34px;
  align-items:start;padding-top:26px}
.rail{position:sticky;top:16px;max-height:calc(100vh - 40px);overflow-y:auto;
  border-right:1px solid var(--edge);padding-right:14px}
.rail h2{font-family:var(--ui);font-size:11px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--fg-faint);margin:0 0 10px;font-weight:600}
.rail h2+h2{margin-top:22px}
.navbtn{display:grid;grid-template-columns:26px 1fr auto;gap:9px;align-items:baseline;
  width:100%;text-align:left;background:none;border:0;border-radius:2px;
  padding:5px 7px;cursor:pointer;color:var(--fg-muted);font-family:var(--body);
  font-size:14px;line-height:1.3}
.navbtn:hover{background:var(--surface-2);color:var(--fg)}
.navbtn[aria-current="true"]{background:var(--surface-2);color:var(--fg);
  box-shadow:inset 2px 0 0 var(--accent)}
.navbtn .n{font-family:var(--ui);font-size:11.5px;color:var(--fg-faint);
  font-variant-numeric:tabular-nums;text-align:right}
.navbtn[aria-current="true"] .n{color:var(--accent)}
.navbtn .dot{width:6px;height:6px;border-radius:50%;background:var(--known);
  opacity:0;align-self:center}
.navbtn.done .dot{opacity:1}
.navbtn.locked{opacity:.34}
.navbtn.locked .t::after{content:" \1F512";font-size:10px}

/* ---------- entries ---------- */
.pane h2.chtitle{font-family:var(--display);font-weight:600;
  font-size:clamp(22px,3.4vw,31px);margin:0;line-height:1.12;text-wrap:balance}
.chnum{font-family:var(--ui);font-size:11px;letter-spacing:.18em;font-weight:600;
  text-transform:uppercase;color:var(--accent);display:block;margin-bottom:8px}
.scene{font-style:italic;color:var(--fg-muted);margin:9px 0 0;max-width:60ch;
  font-size:15px}
.count{font-family:var(--ui);font-size:12px;color:var(--fg-faint);margin-top:14px;
  font-variant-numeric:tabular-nums}

.list{margin:20px 0 0;padding:0;list-style:none;border-top:1px solid var(--edge)}
.row{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:start;
  padding:11px 6px 11px 2px;border-bottom:1px solid var(--edge);cursor:pointer}
.row:hover{background:var(--surface-2)}
.row .mark{width:16px;height:16px;margin-top:4px;border:1px solid var(--edge);
  border-radius:2px;display:grid;place-items:center;background:var(--surface)}
.row .mark svg{width:10px;height:10px;stroke:var(--known);stroke-width:2.6;fill:none;
  opacity:0}
.row.known .mark{border-color:var(--known)}
.row.known .mark svg{opacity:1}
.row.known .w,.row.known .d{opacity:.42}
.w{font-family:var(--body);font-weight:600;font-size:16.5px;color:var(--fg)}
.tag{font-family:var(--ui);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--sea);margin-left:9px;white-space:nowrap}
.d{display:block;color:var(--fg-muted);font-size:15px;margin-top:2px;max-width:68ch}
.prov{font-family:var(--ui);font-size:11px;color:var(--fg-faint);margin-left:9px}

.notice{border:1px solid var(--edge);border-left:2px solid var(--accent);
  background:var(--surface);padding:14px 16px;margin:20px 0 0;font-size:14.5px;
  color:var(--fg-muted);max-width:64ch}
.notice b{color:var(--fg)}
.empty{color:var(--fg-faint);font-style:italic;padding:26px 0}

/* ---------- core sections ---------- */
.sect{font-family:var(--ui);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--fg-faint);font-weight:600;margin:26px 0 0;padding-top:14px;
  border-top:1px solid var(--edge)}
.list .sect:first-child{border-top:0;margin-top:0;padding-top:0}

button:focus-visible,input:focus-visible,.row:focus-visible{outline:2px solid var(--accent);
  outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (max-width:820px){
  .cols{grid-template-columns:1fr;gap:20px}
  .rail{position:static;max-height:230px;border-right:0;padding-right:0;
    border-bottom:1px solid var(--edge);padding-bottom:12px}
  .wrap{padding-inline:16px}
}
</style>

e class they have joined","t":"fr"},{"w":"nabob","d":"someone of conspicuous, usually foreign-made, fortune","t":"lit"},{"w":"cicerone","d":"a local guide who shows visitors the sights","t":"lit"},{"w":"chaperone","d":"older woman who accompanies a young unmarried one in public","t":"gen"},{"w":"betrothal","d":"formal engagement to marry","t":"gen"},{"w":"mesalliance","d":"a marriage beneath one's social rank","t":"fr"}],"travel":[{"w":"post-horses","d":"fresh horses hired in relays at posting stations for fast travel","t":"gen"},{"w":"postilion","d":"rider who guides a carriage team from the saddle rather than a box","t":"gen"},{"w":"diligence","d":"the big public stagecoach","t":"fr"},{"w":"berline","d":"large enclosed four-wheeled travelling carriage","t":"fr"},{"w":"calash / caleche","d":"light carriage with a folding hood","t":"fr"},{"w":"brougham","d":"small closed one-horse town carriage","t":"gen"},{"w":"cabriolet","d":"light two-wheeled one-horse carriage","t":"fr"},{"w":"tilbury","d":"fast, fashionable open two-wheeled gig - the sporting young man's carriage","t":"gen"},{"w":"phaeton","d":"light open carriage driven by its owner, built for speed","t":"gen"},{"w":"barouche","d":"roomy four-wheeled carriage with a folding half-hood","t":"gen"},{"w":"courier","d":"servant sent ahead to arrange horses and lodging on a journey","t":"gen"},{"w":"the telegraph","d":"Chappe semaphore tower relaying signals across France; Danglars' undoing","t":"hist"}],"sea":[{"w":"felucca","d":"small fast Mediterranean boat with triangular lateen sails","t":"naut"},{"w":"tartan","d":"single-masted Mediterranean coasting vessel","t":"naut"},{"w":"supercargo","d":"officer aboard a merchant ship in charge of the cargo and its sale","t":"naut"},{"w":"lateen","d":"triangular sail on a long slanting yard - the Mediterranean rig","t":"naut"},{"w":"roadstead / the roads","d":"sheltered water off a shore where ships may anchor","t":"naut"},{"w":"mizzen / topsail / bowsprit","d":"after mas var TAGS = DATA.tags, CH = DATA.chapters, CORE = DATA.core;

/* ---- flatten ------------------------------------------------------- */
var ALL = [];
Object.keys(CORE).forEach(function(sec){
  CORE[sec].forEach(function(e){
    ALL.push({id:"core:"+sec+":"+e.w.toLowerCase(), w:e.w, d:e.d, t:e.t,
              ch:0, sec:sec.replace(/_/g," ")});
  });
});
Object.keys(CH).forEach(function(n){
  CH[n].words.forEach(function(e){
    ALL.push({id:n+":"+e.w.toLowerCase(), w:e.w, d:e.d, t:e.t, ch:+n});
  });
});
var TOTAL = ALL.length;
document.getElementById("ptot").textContent = TOTAL.toLocaleString();

/* ---- state --------------------------------------------------------- */
var known = Object.create(null), view = "core", tagf = null, dbh = null, saveT = null;
var LS = "mc-glossary-v1";
try{ var raw = localStorage.getItem(LS);
     if(raw){ var p = JSON.parse(raw); known = p.known || Object.create(null);
       if(p.guard){ document.getElementById("guardon").checked = !!p.guard.on;
                    document.getElementById("guardch").value = p.guard.ch || 30; } }
}catch(e){}

function snapshot(){
  return { known: known,
           guard: { on: document.getElementById("guardon").checked,
                    ch: +document.getElementById("guardch").value || 30 } };
}
function save(){
  var s = snapshot();
  try{ localStorage.setItem(LS, JSON.stringify(s)); }catch(e){}
  if(!dbh) return;
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    dbh.doc("progress/state").set(s).catch(function(){});
  }, 600);
}

/* ---- rendering ----------------------------------------------------- */
function guardLimit(){
  return document.getElementById("guardon").checked
       ? (+document.getElementById("guardch").value || 1) : 118;
}
function countKnown(list){ var k=0; list.forEach(function(e){ if(known[e.id]) k++; }); return k; }

function updateMeter(){
  var done = 0, id;
  for(id in known) if(known[id]) done++;
  document.getElementById("pdone").textContent = done.toLocaleString();
  document.getElementById("fill").style.width = (TOTAL ? done/TOTAL*100 : 0) + "%";
}

function buildRail(){
  var rail = document.getElementById("rail"), lim = guardLimit();
  var h = ['<h2>Start here</h2>'];
  var coreList = ALL.filter(function(e){ return e.ch===0; });
  h.push(btn("core", "0", "Core glossary", countKnown(coreList)===coreList.length, false));
  h.push('<h2>Chapters</h2>');
  for(var n=1;n<=117;n++){
    var list = ALL.filter(function(e){ return e.ch===n; });
    h.push(btn(String(n), String(n), CH[n].title, countKnown(list)===list.length, n>lim));
  }
  rail.innerHTML = h.join("");
  Array.prototype.forEach.call(rail.querySelectorAll(".navbtn"), function(b){
    b.addEventListener("click", function(){ view = b.dataset.v; render(); });
  });
}
function btn(v, num, title, done, locked){
  return '<button class="navbtn'+(done?" done":"")+(locked?" locked":"")+'" data-v="'+v+'"'+
         ' aria-current="'+(view===v)+'"><span class="n">'+(num==="0"?"❖":num)+
         '</span><span class="t">'+esc(title)+'</span><span class="dot"></span></button>';
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function rowHTML(e, showProv){
  return '<li class="row'+(known[e.id]?" known":"")+'" data-id="'+e.id+'" tabindex="0" role="button"'+
    ' aria-pressed="'+(!!known[e.id])+'">'+
    '<span class="mark"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 6.4 4.7 9 10 3.2"/></svg></span>'+
    '<span><span class="w">'+esc(e.w)+'</span><span class="tag">'+esc(TAGS[e.t]||e.t)+'</span>'+
    (showProv?'<span class="prov">'+(e.ch===0?"core":"ch. "+e.ch)+'</span>':'')+
    '<span class="d">'+esc(e.d)+'</span></span></li>';
}

function render(){
  var pane = document.getElementById("pane");
  var q = document.getElementById("q").value.trim().toLowerCase();
  var hide = document.getElementById("hideknown").checked;
  var lim = guardLimit();
  var head, items, showProv = false;

  if(q){
    showProv = true;
    items = ALL.filter(function(e){
      return e.ch<=lim && (e.w.toLowerCase().indexOf(q)>=0 || e.d.toLowerCase().indexOf(q)>=0);
    });
    head = '<span class="chnum">Search</span><h2 class="chtitle">&ldquo;'+esc(q)+'&rdquo;</h2>';
  } else if(view==="core"){
    items = ALL.filter(function(e){ return e.ch===0; });
    head = '<span class="chnum">Learn these first</span><h2 class="chtitle">Core glossary</h2>'+
      '<p class="scene">Terms that recur throughout the novel. These carry the most weight: '+
      'learn them once and every chapter gets easier.</p>';
  } else {
    var n = +view;
    if(n>lim){
      pane.innerHTML = '<span class="chnum">Chapter '+n+'</span>'+
        '<h2 class="chtitle">Hidden by the spoiler guard</h2>'+
        '<div class="notice">You&rsquo;ve set the guard at chapter '+lim+'. The glosses below '+
        'give away plot, so this chapter stays closed until you raise the guard or switch it off.</div>';
      return;
    }
    items = ALL.filter(function(e){ return e.ch===n; });
    head = '<span class="chnum">Chapter '+n+'</span><h2 class="chtitle">'+esc(CH[n].title)+'</h2>'+
           '<p class="scene">'+esc(CH[n].scene)+'</p>';
  }

  if(tagf) items = items.filter(function(e){ return e.t===tagf; });
  var hidden = 0;
  if(hide){ var before = items.length;
            items = items.filter(function(e){ return !known[e.id]; });
            hidden = before - items.length; }

  var body;
  if(!items.length){
    body = '<p class="empty">'+(hidden?"Everything here is marked known.":"No terms match.")+'</p>';
  } else if(!q && view==="core" && !tagf){
    var bySec = {}, order = [];
    items.forEach(function(e){ if(!bySec[e.sec]){bySec[e.sec]=[];order.push(e.sec);} bySec[e.sec].push(e); });
    body = '<ul class="list">'+order.map(function(s){
      return '<li class="sect">'+esc(s)+'</li>'+bySec[s].map(function(e){return rowHTML(e,false);}).join("");
    }).join("")+'</ul>';
  } else {
    body = '<ul class="list">'+items.map(function(e){return rowHTML(e,showProv);}).join("")+'</ul>';
  }

  pane.innerHTML = head + '<p class="count">'+items.length+' term'+(items.length===1?"":"s")+
    (hidden?' &middot; '+hidden+' known, hidden':'')+'</p>' + body;

  Array.prototype.forEach.call(pane.querySelectorAll(".row"), function(r){
    r.addEventListener("click", function(){ toggle(r); });
    r.addEventListener("keydown", function(ev){
      if(ev.key===" "||ev.key==="Enter"){ ev.preventDefault(); toggle(r); } });
  });
  Array.prototype.forEach.call(document.querySelectorAll(".navbtn"), function(b){
    b.setAttribute("aria-current", String(b.dataset.v===view)); });
}

function toggle(r){
  var id = r.dataset.id;
  known[id] = !known[id];
  if(!known[id]) delete known[id];
  r.classList.toggle("known", !!known[id]);
  r.setAttribute("aria-pressed", String(!!known[id]));
  if(document.getElementById("hideknown").checked && known[id]) render();
  updateMeter(); save(); refreshDots();
}
function refreshDots(){
  Array.prototype.forEach.call(document.querySelectorAll(".navbtn"), function(b){
    var v = b.dataset.v;
    var list = ALL.filter(function(e){ return v==="core" ? e.ch===0 : e.ch===+v; });
    b.classList.toggle("done", list.length>0 && countKnown(list)===list.length);
  });
}

    keys.map(function(k){ return '<button class="chip" data-t="'+k+'" aria-pressed="false">'+
      esc(TAGS[k]||k)+' '+counts[k]+'</button>'; }).join("");
  Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(c){
    c.addEventListener("click", function(){
      tagf = c.dataset.t || null;
      Array.prototype.forEach.call(document.querySelectorAll(".chip"), function(o){
        o.setAttribute("aria-pressed", String(o===c)); });
      render();
    });
  });
})();

/* ---- wiring -------------------------------------------------------- */
document.getElementById("q").addEventListener("input", render);
document.getElementById("hideknown").addEventListener("change", render);
document.getElementById("guardon").addEventListener("change", function(){
  document.getElementById("guardch").disabled = !this.checked;
  buildRail(); refreshDots(); render(); save();
});
document.getElementById("guardch").addEventListener("change", function(){
  buildRail(); refreshDots(); render(); save();
});

buildRail(); refreshDots(); updateMeter(); render();

/* ---- cross-device progress (optional) ------------------------------ */
if(window.claude && window.claude.use){
  window.claude.use("db").then(function(db){
    if(!db) return;
    dbh = db;
    return db.doc("progress/state").get().then(function(doc){
      var d = doc && (doc.data || doc);
      if(d && d.known && Object.keys(d.known).length >= Object.keys(known).length){
        known = d.known;
        if(d.guard){
          document.getElementById("guardon").checked = !!d.guard.on;
          document.getElementById("guardch").disabled = !d.guard.on;
          document.getElementById("guardch").value = d.guard.ch || 30;
        }
        buildRail(); refreshDots(); updateMeter(); render();
      }
    });
  }).catch(function(){});
}
})();
</script>
